name: Arabic subtitle check (fork only)
on:
  push:
    branches: [ci/arabic-subtitle-check]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: check
      - uses: actions/checkout@v4
        with:
          repository: lcy362/agnes-video-generator
          ref: master
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt
      - run: dpkg -l | grep -i fribidi || echo "no fribidi"
      - run: git -C app log --oneline -1
      - run: python check/.github/arabic-check/recheck.py app out
      - uses: actions/upload-artifact@v4
        with:
          name: recheck-linux
          path: out/*.png
